    <!-- Google tag (gtag.js) — script injected after window.load so analytics stays off the critical path.
         Events queue in dataLayer until the library arrives, so nothing is lost. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      // Report path only — keeps tokens/query strings/fragments out of GA
      gtag("config", "G-YT5RXPQQRD", { page_location: location.origin + location.pathname });

      window.addEventListener("load", function () {
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=G-YT5RXPQQRD";
        document.head.appendChild(s);
      });
    </script>
