name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Production build (mirrors Render)
    runs-on: ubuntu-latest
    env:
      # Render installs with NODE_ENV=production (devDependencies skipped).
      # Keeping CI identical catches "package in the wrong dependency block" failures.
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Build
        run: npm run build:prod
